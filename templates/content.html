<!DOCTYPE html>
<html>
<head>
    <title>Content Page</title>

        body { font-family: Arial; margin: 40px; } 
        .count { font-size: 20px; font-weight: bold; color: #525252; margin: 20px 0; }
    </style>
</head>
<body>

    {{end}}
    
    <!-- Zurück-Button -->
    <a href="/"><button>Back</button></a>
</body>
</html>
