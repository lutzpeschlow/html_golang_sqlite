<!DOCTYPE html>
<html>
<head>
    <title>Data Storage</title>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial; 
            max-width: 500px; margin: 50px auto; padding: 20px; 
        }
        .form-group { margin-bottom: 15px; }
        input[type=number] { 
            width: 100%; padding: 12px; font-size: 18px; 
            border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 15px; font-size: 18px; 
            background: linear-gradient(45deg, #28a745, #20c997); 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer; transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .result { 
            margin-top: 20px; padding: 20px; background: #d4edda; 
            border-radius: 8px; border-left: 5px solid #28a745;
        }
        .error { 
            margin-top: 20px; padding: 20px; background: #f8d7da; 
            border-radius: 8px; border-left: 5px solid #dc3545; color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Data Storage</h1>
    <p>Input Numbers</p>
    
    <form method="POST" action="/calculate">
        <div class="form-group">
            <label>number 1:</label>
            <input type="number" name="num1" required min="-999999" max="999999">
        </div>
        <div class="form-group">
            <label>number 2:</label>
            <input type="number" name="num2" required min="-999999" max="999999">
        </div>
        <button type="submit">Apply</button>
    </form>
</body>
</html>
